# Source catalogue for the Protestant Christian corpus.
# Three public-domain English Bible translations, flat-list shape
# ({book, chapter, verse, text}) — see README.md. Converter: bible_flat (Phase 2).
source_url: https://github.com/bibleapi/bibleapi-bibles-json
provenance:
  retrieved_from: github.com/bibleapi/bibleapi-bibles-json (KJV, ASV); github.com/TehShrike/world-english-bible (WEB); upstream dumps built 2026-08-20
  fetch_method: working-group Box drop ("Phase I / raw JSON")
  fetch_date: "2026-10-10"
notes: >-
  KJV and ASV from bibleapi-bibles-json; WEB from TehShrike/world-english-bible.
  Those three are public domain (see README.md). NRSV is copyrighted
  (National Council of the Churches of Christ in the USA) and is held back:
  the catalogue entry is committed, the payload is gitignored and local-only.
targets:
  - payload: kjv.json
    converter: bible_flat
    work: The Bible
    version: KJV
    language: en
    document_type: scripture
    tradition: [Protestant Christian]
    license: public-domain
    license_detail: King James Version — public domain
    requested_as: ["the King James Version", "the KJV", "the King James Bible", "the KJV Bible"]
    canonical_language: en
  - payload: asv.json
    converter: bible_flat
    work: The Bible
    version: ASV (1901)
    language: en
    document_type: scripture
    tradition: [Protestant Christian]
    license: public-domain
    license_detail: American Standard Version (1901) — public domain
    requested_as: ["the American Standard Version", "the ASV"]
    canonical_language: en
  - payload: web.json
    converter: bible_flat
    work: The Bible
    version: WEB
    language: en
    document_type: scripture
    tradition: [Protestant Christian]
    license: public-domain
    license_detail: World English Bible — public domain
    requested_as: ["the World English Bible", "the WEB"]
    canonical_language: en
  - payload: nrsv.json
    converter: bible_flat
    work: The Bible
    version: NRSV
    language: en
    document_type: scripture
    tradition: [Protestant Christian]
    license: restricted
    provenance:
      retrieved_from: National Council of the Churches of Christ in the USA (NRSV)
      fetch_method: licensed text, held back; not committed to this public repo
      fetch_date: unknown
    license_detail: >-
      New Revised Standard Version — (c) 1989 National Council of the Churches
      of Christ in the United States of America. Used by permission. All rights
      reserved. Payload held back from this public repo. Local file, if you
      hold rights to it, must be the bible_flat shape
      ({book, chapter, verse, text}).
    requested_as: ["the New Revised Standard Version", "the NRSV"]
    canonical_language: en
