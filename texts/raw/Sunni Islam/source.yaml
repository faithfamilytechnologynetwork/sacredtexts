  # --- English of the six canonical books (Kutub al-Sittah). Same hadith-json files as the
  # Arabic (AhmedBaset/hadith-json@70b83d6, a sunnah.com scrape), with the `english` field kept
  # and `arabic` dropped (it is committed beside, under _arabic_only). Converter hadith_sunnah_en;
  # citations pair 1:1 with the Arabic edition. Translations, so outside the question pool.
  # Owner decision 2026-11-01 (Waleed): the English is widely used and freely available online;
  # included for academic benchmark research under the project's fair-use decision (issue #4).
