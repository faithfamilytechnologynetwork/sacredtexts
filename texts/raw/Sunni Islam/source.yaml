      fetch_method: raw download; arabic field dropped (committed beside)
      fetch_date: "2026-11-01"
    license_detail: sunnah.com English translation (Muhsin Khan). Freely available online; see the block comment above.
    requested_as: ["Sahih al-Bukhari", "Sahih Bukhari", "Bukhari"]
    canonical_language: ar
