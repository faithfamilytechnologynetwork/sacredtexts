# Source catalogue for the Sunni Islam corpus.
# The Qur'an (Uthmani script, dict keyed "surah:ayah") plus the six canonical hadith
# collections (the Kutub al-Sittah: Bukhari, Muslim, Abu Dawud, Tirmidhi, Nasa'i, Ibn Majah)
# in Arabic (from sunnah.com); owner decision, issue #74 — Muwatta Malik, Musnad Ahmad and
# Sunan al-Darimi were dropped. The same six books are ALSO present in English — the same
# sunnah.com scrape with the `english` field kept instead of `arabic`. Converters: quran_qul
# (Qur'an Uthmani), quran_qul_simple (Saheeh International English), hadith_sunnah (Arabic
# hadith), hadith_sunnah_en (English of the six canonical books). Both English editions (Saheeh
# International; the six English hadith books) are translations, so they stay OUT of the
# original-language question pool.
provenance:
  retrieved_from: Quranic Universal Library (qul.tarteel.ai); sunnah.com (hadith, Arabic and English, via AhmedBaset/hadith-json)
  fetch_method: working-group Box drop ("Phase I / raw JSON"); English hadith raw download (see per-target provenance)
  fetch_date: "2026-10-10"
notes: >-
  Qur'an: KFGQPC Uthmani script via the Quranic Universal Library (QUL); Saheeh International
  English translation via QUL (outside the pool). Hadith: classical Arabic text mirrored from
  sunnah.com; the six canonical books also in English (sunnah.com translation, outside the pool).
targets:
  - payload: quran_uthmani_from_qul.json.json
    converter: quran_qul
    work: The Qur'an
    version: Uthmani (QUL)
    language: ar
    document_type: scripture
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: KFGQPC Uthmani script via the Quranic Universal Library (QUL)
    requested_as: ["the Qur'an", "the Quran", "the Koran", "the Holy Qur'an"]
    canonical_language: ar
  - payload: quran_saheeh_international_from_qul.json
    converter: quran_qul_simple
    work: The Qur'an
    version: Saheeh International (QUL)
    language: en
    document_type: scripture
    tradition: [Sunni Islam]
    license: open
    provenance:
      retrieved_from: qul.tarteel.ai/resources/translation/193 ("simple.json" export)
      fetch_method: signed-in download by the maintainer (QUL gates file downloads behind a free account)
      fetch_date: "2026-11-01"
    license_detail: >-
      Saheeh International English translation (© Saheeh International / Dar Abul-Qasim, Jeddah).
      Distributed free of charge online and mirrored widely (QUL, quran.com, tanzil.net); QUL
      maintains this copy with ongoing corrections. Included for academic benchmark research under
      the project's fair-use decision (issue #4); chosen by the maintainer (the working group's
      Islam representative) as the single representative English translation (issue #43 tracks
      pre-release licence clearance).
    requested_as: ["the Qur'an", "the Quran", "the Koran", "the Holy Qur'an"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_arabic_only/bukhari.json
    converter: hadith_sunnah
    work: Sahih al-Bukhari
    version: sunnah.com Arabic
    language: ar
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: Classical Arabic text via sunnah.com
    requested_as: ["Sahih al-Bukhari", "Sahih Bukhari", "Bukhari"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_arabic_only/muslim.json
    converter: hadith_sunnah
    work: Sahih Muslim
    version: sunnah.com Arabic
    language: ar
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: Classical Arabic text via sunnah.com
    requested_as: ["Sahih Muslim"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_arabic_only/abudawud.json
    converter: hadith_sunnah
    work: Sunan Abi Dawud
    version: sunnah.com Arabic
    language: ar
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: Classical Arabic text via sunnah.com
    requested_as: ["Sunan Abi Dawud", "Abu Dawud"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_arabic_only/tirmidhi.json
    converter: hadith_sunnah
    work: Jami` at-Tirmidhi
    version: sunnah.com Arabic
    language: ar
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: Classical Arabic text via sunnah.com
    requested_as: ["Jami' at-Tirmidhi", "Tirmidhi"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_arabic_only/nasai.json
    converter: hadith_sunnah
    work: Sunan an-Nasa'i
    version: sunnah.com Arabic
    language: ar
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: Classical Arabic text via sunnah.com
    requested_as: ["Sunan an-Nasa'i", "Nasa'i"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_arabic_only/ibnmajah.json
    converter: hadith_sunnah
    work: Sunan Ibn Majah
    version: sunnah.com Arabic
    language: ar
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: public-domain
    license_detail: Classical Arabic text via sunnah.com
    requested_as: ["Sunan Ibn Majah", "Ibn Majah"]
    canonical_language: ar
  # --- English of the six canonical books (Kutub al-Sittah). Same hadith-json files as the
  # Arabic (AhmedBaset/hadith-json@70b83d6, a sunnah.com scrape), with the `english` field kept
  # and `arabic` dropped (it is committed beside, under _arabic_only). Converter hadith_sunnah_en;
  # the English citations are a strict subset of the Arabic edition's (three hadith have no
  # English — one each in Bukhari, Muslim, Tirmidhi). Translations, so outside the question pool.
  #
  # Translator attribution: sunnah.com itself publishes NO per-collection translator/publisher
  # credits — its stated policy is "for the English we use various translators" — and the scraped
  # metadata carries only the classical compiler, not the translator. The per-book translator
  # recorded below is therefore the identified published edition sunnah.com's English matches (the
  # Darussalam English hadith series, as documented by community research), NOT a credit sunnah.com
  # asserts; Muslim and Abu Dawud are left unattributed because no single edition is confidently
  # identified. "Freely available online" describes AVAILABILITY, not a copyright licence.
  # Owner decision 2026-11-01 (Waleed): included for academic benchmark research under the
  # project's fair-use decision (issue #4); issue #43 tracks pre-release licence clearance.
  - payload: hadith_from_sunnah.com_english_only/bukhari.json
    converter: hadith_sunnah_en
    work: Sahih al-Bukhari
    version: sunnah.com English
    language: en
    document_type: hadith_collection
    tradition: [Sunni Islam]
    license: open
    provenance:
      retrieved_from: github.com/AhmedBaset/hadith-json@70b83d6d21995bb32f8d7271cd75501be5a922a7 (db/by_book/the_9_books/bukhari.json, english field)
      fetch_method: raw download; arabic field dropped (committed beside)
      fetch_date: "2026-11-01"
    license_detail: >-
      sunnah.com credits no per-collection translator; text matches the Darussalam edition
      (tr. Dr. Muhammad Muhsin Khan). "Freely available online" is availability, not a licence —
      see the block comment above.
    requested_as: ["Sahih al-Bukhari", "Sahih Bukhari", "Bukhari"]
    canonical_language: ar
  - payload: hadith_from_sunnah.com_english_only/muslim.json
    converter: hadith_sunnah_en
    work: Sahih Muslim
    version: sunnah.com English
    language: en
    document_type: hadith_collection
