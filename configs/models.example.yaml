# Example model panel for `sacredbench collect` — the Spec 3 tutorial panel.
# Copy to configs/models.yaml (gitignored) and adjust. Keys come from the environment
# — never from a file in this public repo (ANTHROPIC_API_KEY here).
#
# This is a 2-MODEL panel (one opus-class, one haiku-class) run BOTH WAYS — with the
# Anthropic server-side web-search tool enabled and disabled — i.e. 2 models x
# search-{on,off} = 4 entries. The contrast the benchmark exists to show is parametric
# recall (tools off) vs. tool-assisted retrieval (tools on): the search-on entries are
# expected to quote scripture more accurately. The viewer shows all four side by side,
# and the tools setting is part of each entry's panel identity, so on/off never collapse
# into one row.
#
# UNPRICED by design: with web search billed per request (not captured in in/out
# tokens), setting price_in/price_out would understate the true cost — so `score` reports
# token totals only, no cost figure. (Prices are never invented.)
concurrency: 4
models:
  - id: opus-search
    provider: anthropic          # web_search is an Anthropic server-side tool
    model: claude-opus-5-5
    max_tokens: 4096             # headroom: search + citation blocks share the budget
    # temperature: 0             # optional; pins sampling and joins the panel fingerprint.
    #                              NOT set here: this config reproduces the committed
    #                              runs/tutorial-2026-10-11 run, whose answers were collected
    #                              with no temperature — setting it would change the fingerprint
    #                              and break `score --config` against that run.
    tools: [web_search]          # tool-assisted retrieval
  - id: opus
    provider: anthropic
    model: claude-opus-5-5
    max_tokens: 4096             # parametric recall (no tools); headroom so a long
    #                              Hebrew/Aramaic quote does not trip the truncation guard
  - id: haiku-search
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 4096
    tools: [web_search]
  - id: haiku
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 4096
  # Multi-provider is still supported — this tutorial panel is all-Anthropic for simplicity.
  # web_search is each provider's NATIVE server-side search (Anthropic web_search, OpenAI
  # Responses-API web_search, Google-Search grounding). It is valid (a) on a native endpoint
  # (provider: anthropic / openai-with-no-base_url / gemini), and (b) through a host DECLARED to
  # forward native search — today OpenRouter (base_url host openrouter.ai) — but only for the
  # families it forwards (anthropic/*, openai/*; see config._SEARCH_FORWARDING_HOST_NETLOCS and
  # providers.OPENROUTER_SEARCH_TOOL_BY_FAMILY). web_search on an UNDECLARED host, or a
  # non-forwarded family, is rejected at load time — an arbitrary host is not assumed to forward
  # native search and could be a generic third-party web layer (:online / Exa), out of scope
  # (#54). A no-tools entry on any OpenAI-compatible host always works. Example OpenRouter entry:
  # - id: sol-search
  #   provider: openai
  #   model: openai/gpt-6.1-sol                # a forwarded family (openai/*)
  #   base_url: https://openrouter.ai/api/v1   # the declared forwarding host
  #   api_key_env: OPENROUTER_API_KEY
  #   max_tokens: 4096
  #   temperature: 0                           # optional; omit to use the host default
  #   tools: [web_search]                      # OK here: declared host + forwarded family
