# Native-script citation labels for cite_passage (issue #112). Data, not code: read by
# sacredbench/citations.py.
#
# A label is written exactly as the expected citations write it ("Acts 24:1", "Eruvin 91a:1",
# "Ang 734:8"); its list holds the forms a model may write in the text's own script. Matching
# ignores case, Greek accents and breathings, Hebrew points, and the Greek numeral sign (Β΄), so
# list each spelling once, unaccented variants are covered. Ordinals that follow a Hebrew book
# name may carry a geresh (שמואל א׳); that is covered too.
#
# segment_indexed: the citation's last number is an index finer than the conventional citation
# (Sefaria's segment within a Talmud amud; the line on a Guru Granth Sahib Ang). Under the #112
# granularity policy the headline is scored without it (citations.HEADLINE_DROPS_SEGMENT).
#
# chapter_names: for a bare chapter:verse citation ("34:46"), the chapter may be named instead of
# numbered (سورة سبأ، الآية 46).

editions:
  - edition: Greek New Testament (Scrivener 1894)
    labels:
      Matthew: [Ματθαῖος, Κατὰ Ματθαῖον, Ματθαῖον, Ματθαίου]
      Mark: [Μᾶρκος, Κατὰ Μᾶρκον, Μᾶρκον, Μάρκου]
      Luke: [Λουκᾶς, Κατὰ Λουκᾶν, Λουκᾶν, Λουκᾶ]
      John: [Ἰωάννης, Κατὰ Ἰωάννην, Ἰωάννην, Ἰωάννου]
      Acts: [Πράξεις, Πράξεις τῶν Ἀποστόλων, Πράξεις Ἀποστόλων]
      Romans: [Πρὸς Ῥωμαίους, Ῥωμαίους]
      1 Corinthians: [Πρὸς Κορινθίους Α΄, Α΄ Πρὸς Κορινθίους, Α΄ Κορινθίους, Κορινθίους Α΄]
      2 Corinthians: [Πρὸς Κορινθίους Β΄, Β΄ Πρὸς Κορινθίους, Β΄ Κορινθίους, Κορινθίους Β΄]
      Galatians: [Πρὸς Γαλάτας, Γαλάτας]
      Ephesians: [Πρὸς Ἐφεσίους, Ἐφεσίους]
      Philippians: [Πρὸς Φιλιππησίους, Φιλιππησίους]
      Colossians: [Πρὸς Κολοσσαεῖς, Κολοσσαεῖς]
      1 Thessalonians: [Πρὸς Θεσσαλονικεῖς Α΄, Α΄ Πρὸς Θεσσαλονικεῖς, Α΄ Θεσσαλονικεῖς, Θεσσαλονικεῖς Α΄]
      2 Thessalonians: [Πρὸς Θεσσαλονικεῖς Β΄, Β΄ Πρὸς Θεσσαλονικεῖς, Β΄ Θεσσαλονικεῖς, Θεσσαλονικεῖς Β΄]
      1 Timothy: [Πρὸς Τιμόθεον Α΄, Α΄ Πρὸς Τιμόθεον, Α΄ Τιμόθεον, Τιμόθεον Α΄]
      2 Timothy: [Πρὸς Τιμόθεον Β΄, Β΄ Πρὸς Τιμόθεον, Β΄ Τιμόθεον, Τιμόθεον Β΄]
      Titus: [Πρὸς Τίτον, Τίτον]
      Philemon: [Πρὸς Φιλήμονα, Φιλήμονα]
      Hebrews: [Πρὸς Ἑβραίους, Ἑβραίους]
      James: [Ἰακώβου, Ἐπιστολὴ Ἰακώβου]
      1 Peter: [Πέτρου Α΄, Α΄ Πέτρου]
      2 Peter: [Πέτρου Β΄, Β΄ Πέτρου]
      1 John: [Ἰωάννου Α΄, Α΄ Ἰωάννου]
      2 John: [Ἰωάννου Β΄, Β΄ Ἰωάννου]
      3 John: [Ἰωάννου Γ΄, Γ΄ Ἰωάννου]
      Jude: [Ἰούδα]
      Revelation: [Ἀποκάλυψις, Ἀποκάλυψις Ἰωάννου]

