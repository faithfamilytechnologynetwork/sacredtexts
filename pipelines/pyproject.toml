[project]
name = "sacredbench"
version = "0.1.0"
description = "CEFE-AI SacredBench (the Sacred Texts Benchmark) — Phase 1 pipeline (convert, generate, collect, score)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sacredbench"]
